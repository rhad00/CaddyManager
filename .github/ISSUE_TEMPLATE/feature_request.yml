name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. CaddyManager manages **your own Caddy reverse proxy**; it is not an ingress controller and has
        no Kubernetes integration, so requests in that direction will not be accepted.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and the roadmap in the README
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution. For example "I run X behind Cloudflare and cannot ...".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds, other tools, or a Caddyfile snippet that does what you want today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Proxies and routes
        - Templates
        - Certificates and TLS
        - Security (auth, IP filtering, rate limits)
        - Docker discovery
        - Git integration and backups
        - Alerts and logs
        - API
        - UI
        - Deployment and installation
        - Other
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "No"
        - Yes, I can open a pull request
        - Yes, with some guidance
