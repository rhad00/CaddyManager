name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel redundant runs triggered by fast successive pushes to main
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read # release notes quote the summary of the merged pull requests
  packages: write
  id-token: write
  attestations: write

jobs:
  # ─── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend (ESLint)
        working-directory: backend
        run: |
          if npm run lint --if-present 2>/dev/null; then
            echo "Backend lint passed"
          else
            echo "No lint script in backend — skipping"
          fi

  # ─── Job 2: Version bump via Cocogitto ────────────────────────────────────────
  version:
    name: Semantic Version Bump
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cog.outputs.version }}
      new_release: ${{ steps.cog.outputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the pushed tag triggers downstream workflows.
          # Falls back to GITHUB_TOKEN if PAT is not set (downstream won't re-trigger).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # cog is installed directly, not through cocogitto-action: that action always runs `cog check` over the
      # WHOLE history unless told otherwise (its `check` input defaults to true), which fails on every old
      # non-conventional commit. The version is pinned and the download verified (checksum taken from the
      # 6.3.0 release asset; upstream publishes none).
      - name: Install Cocogitto
        env:
          COG_VERSION: '6.3.0'
          COG_SHA256: '046dbc0ea190528f5a028a64ed761d605f4be85de3a6e469174139331eb058bb'
        run: |
          archive="cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/${archive}"
          echo "${COG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          "$RUNNER_TEMP/x86_64-unknown-linux-musl/cog" --version

      # Informational, not a gate: `cog bump` ignores commits that are not conventional (they are left out of the
      # version calculation and the changelog), and a commit pushed straight to main (the GitHub web editor's
      # "Add files via upload", for example) must not block every later release. Pull requests are checked
      # in ci.yml before they can be merged.
      - name: Check commits since the latest release
        run: |
          if ! cog check --from-latest-tag; then
            echo "::warning title=Non-conventional commits on main::They are ignored by the release (not in the version bump or the changelog). Use 'type(scope): subject' messages."
          fi

      # main is protected, so the bump commit (CHANGELOG.md + package versions) is only tagged, never merged.
      # Each release's CHANGELOG.md therefore lives on its tag; bring the newest one back so the new
      # section is prepended to the full history instead of starting a new file.
      - name: Restore the accumulated CHANGELOG.md
        run: bash scripts/restore-changelog.sh

      - name: Bump version, write CHANGELOG.md and tag
        id: cog
        run: |
          git tag --list 'v[0-9]*' | sort > "$RUNNER_TEMP/tags.before"
          # --skip-untracked: the restored CHANGELOG.md shows up as a modified file
          cog bump --auto --skip-untracked
          git tag --list 'v[0-9]*' | sort > "$RUNNER_TEMP/tags.after"
          # Empty when there was nothing to release (only chore commits, for instance)
          echo "version=$(comm -13 "$RUNNER_TEMP/tags.before" "$RUNNER_TEMP/tags.after" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        if: steps.cog.outputs.version != ''
        env:
          VERSION: ${{ steps.cog.outputs.version }}
        run: git push origin "refs/tags/${VERSION}"

  # ─── Job 3: Build & push Docker images ────────────────────────────────────────
  docker:
    name: Docker / ${{ matrix.component }}
    needs: version
    if: needs.version.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: caddymanager-backend
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: caddymanager-frontend
          - component: caddy
            context: ./caddy
            dockerfile: ./caddy/Dockerfile
            image: caddymanager-caddy

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact tagged commit so images match the release
          ref: ${{ needs.version.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.vendor=rhad00
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ─── Job 4: GitHub Release with changelog ─────────────────────────────────────
  release:
    name: GitHub Release
    needs: [version, docker]
    if: needs.version.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.version }}

      # Summary (from the merged pull requests), the commits of this release, a link to CHANGELOG.md at the
      # tag and the image references. The checkout is the tag, so the script uses the scripts of that release.
      - name: Build the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notes.js > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
