name: CI - Lint and Test

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build --silent

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # checkJs over backend/src (backend/tsconfig.json): types come from JSDoc and the
      # @types packages, and the build fails on a type error
      - name: Type-check the backend
        working-directory: backend
        run: npm run typecheck

      # Unit and integration tests in one run, so the coverage threshold
      # (backend/jest.ci.config.js) applies to the whole suite
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          DB_TYPE: sqlite
          SQLITE_PATH: ':memory:'
        run: npm run test:ci

      - name: Build the backend
        working-directory: backend
        run: npm run build

      - name: Build Caddy image (with project plugins)
        run: docker build -t caddymanager-caddy:ci ./caddy

      - name: Run Caddy config contract tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          CADDY_IMAGE: caddymanager-caddy:ci
          CADDY_CONTRACT_REQUIRED: 'true'
          CADDY_REQUIRED_MODULES: http.handlers.rate_limit,dns.providers.cloudflare
        run: npm run test:contract

      # Real Caddy in front of test origins (S3/SigV4, every template, headers, balancing, auth...).
      # Uses --network host, which the Linux runner supports.
      - name: Run end-to-end proxy tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          CADDY_IMAGE: caddymanager-caddy:ci
          CADDY_E2E_REQUIRED: 'true'
        run: npm run test:e2e

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # The image production runs: compiled in a build stage, only dist/ shipped. A separate
  # job so the build context is a fresh checkout (no node_modules)
  backend-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the backend Docker image
        run: docker build -t caddymanager-backend:ci ./backend

      # Building proves little: start the image next to the project Caddy and wait for /ready
      # (it runs the migrations and loads the Caddy config before it answers)
      - name: Start the backend image next to Caddy
        run: |
          docker network create smoke
          docker build -t caddymanager-caddy:smoke ./caddy
          docker run -d --name caddy --network smoke --network-alias caddy caddymanager-caddy:smoke
          docker run -d --name backend --network smoke -p 3000:3000 \
            -e NODE_ENV=production -e JWT_SECRET=ci-smoke-secret-0123456789 \
            -e GIT_SECRET_KEY=ci-smoke-git-key-0123456789 -e CSRF_SECRET=ci-smoke-csrf-0123456789 \
            -e CADDY_API_URL=http://caddy:2019 caddymanager-backend:ci
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ready)" = "200" ] && exit 0
            sleep 1
          done
          docker logs backend
          exit 1

  # Production runs on PostgreSQL; the model syncs and migrations differ from SQLite
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: caddymanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # One file at a time: the test files share the database
      - name: Run backend integration tests on PostgreSQL
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          DB_TYPE: postgres
          DB_URL: postgres://postgres:ci-postgres-password@localhost:5432/caddymanager_test
        run: npm run test:integration -- --runInBand

  # The browser tests mock the API (no backend needed); they catch frontend breakage
  # that the unit tests and the build cannot
  frontend-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

